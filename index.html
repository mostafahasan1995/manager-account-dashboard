<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cashier Console</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Runtime configuration, BEFORE the bundle and deliberately a classic script: a classic script
      runs to completion as the parser reaches it, while module scripts are deferred, so
      window.__APP_CONFIG__ exists by the time src/config.ts reads it. Vite warns that it cannot
      bundle this tag; that is the point — it must stay a separate file the container can rewrite.
      See public/config.js and docker/40-runtime-config.sh.
    -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
