# Dashboard CI/CD.
#
#   pull_request        -> verify, build, e2e
#   push to master      -> verify, build, e2e -> image (sha-<7>) -> deploy (environment: production)
#   workflow_dispatch   -> verify, build, e2e; on master also builds and tests the image but never
#                          pushes it, and never deploys: a deploy is the consequence of a merge, not
#                          of a button someone pressed.
#
# The same shape is used in every repo of this product (backend, dashboard, mini-app), so they
# behave identically. See deploy/docs/CONTRACT.md, section 7.
#
# SECURITY NOTES
#  - Never `pull_request_target`: that event runs with repository secrets against code from a fork.
#  - Every action the image and deploy jobs use is pinned to a full commit SHA (a tag can be moved;
#    a SHA cannot), with the release in a comment. Resolve new ones with
#    `git ls-remote https://github.com/<owner>/<action>.git refs/tags/<tag>`.
#  - Permissions are least-privilege: read-only by default, and only `image` can write packages.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs of a PULL REQUEST are cancelled, as before. Runs on a branch are NOT: this group is
# per ref, so with a blanket cancel-in-progress a second merge to master would kill the first run
# while its deploy job was half-way through a rollout. Pushes queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The suite pins its own env in vitest.config.ts; these are for the build and the E2E bundle.
  VITE_API_BASE_URL: http://localhost:3000
  VITE_ENABLE_MOCKS: 'true'

jobs:
  verify:
    name: Format, typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # First, because it is the cheapest step and the one whose failure is least interesting to
      # read a stack trace for. Formatting drift costs attention in review that should be going to
      # the money path; 88 files had already drifted before this step existed.
      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:cov

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The suite builds and serves the real bundle against the in-browser mock API, so it needs
      # no backend, no database and no Telegram bot.
      - name: Run Playwright
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: Build and push image
    # All three gates: the image is built from the same commit that passed format, types, lint,
    # unit tests, a production build AND the end-to-end suite.
    needs: [verify, build, e2e]
    # master only: pull requests never push images (that would need packages: write on untrusted code).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `sha-<7 chars>` is immutable and is the ONLY thing deploy.sh deploys or rolls back to.
      # The branch tag (`master`) floats and exists for humans. Nothing is ever tagged `latest`.
      - name: Tags for cashier-dashboard
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mostafahasan1995/cashier-dashboard
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      # Built once into the local Docker engine and TESTED before anything is pushed. The workflow-level
      # VITE_* env above does not reach this build — docker only sees --build-arg values — and the
      # Dockerfile sets VITE_ENABLE_MOCKS=false itself.
      # linux/amd64 only: the Contabo VPS is x86. The cache scope is per image, so this repo's cache
      # export never overwrites another image's.
      - name: Build cashier-dashboard for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: cashier-dashboard:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cashier-dashboard
          cache-to: type=gha,mode=max,scope=cashier-dashboard

      # The hand-written JSON encoding in docker/40-runtime-config.sh, run inside the real image with
      # hostile values (quotes, newlines, </script>, unicode) and checked with node. Cheap, and the one
      # piece of this image that string-handling bugs could turn into an injection.
      - name: Test runtime config generation
        run: bash docker/test-runtime-config.sh cashier-dashboard:ci

      # `sha-<7 chars>` is only immutable because CI never writes it twice: GHCR tags are mutable, and
      # a rebuild of the same commit weeks later (cold cache, newer base packages) would put different
      # bytes behind a tag deploy.sh promises to roll back to exactly. So the push below runs only on a
      # `push` event (workflow_dispatch stops after the build and test above), and never when the sha
      # tag is already in the registry — which also covers "Re-run all jobs" on an old push run, since
      # a re-run keeps the original event. If the lookup itself fails (network, registry outage) the
      # tag counts as absent and the push goes ahead, as before.
      - name: Check whether this commit's image already exists
        id: existing
        if: github.event_name == 'push'
        run: |
          image="ghcr.io/mostafahasan1995/cashier-dashboard:sha-${GITHUB_SHA:0:7}"
          if docker buildx imagetools inspect "${image}" > /dev/null 2>&1; then
            echo "::notice title=Image not re-pushed::${image} already exists; it is never overwritten."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      # Same inputs as the build step above, so every layer is a cache hit: this only tags and uploads.
      - name: Push cashier-dashboard
        if: github.event_name == 'push' && steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cashier-dashboard
          cache-to: type=gha,mode=max,scope=cashier-dashboard

  deploy:
    name: Deploy to VPS
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # 45, not less: deploy.sh first waits up to DEPLOY_LOCK_TIMEOUT (900 s) on flock while another
    # repo deploys — and a backend deploy with a rollback can hold that lock for a long time — then
    # this rollout is pull + up + the 180 s health gate, and on failure a rollback that runs the gate
    # again, plus runner and SSH setup. A job timeout that fires inside that window cuts the session
    # mid-rollout.
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    # Queue, never cancel: killing a deploy half-way leaves the old container stopped and the new one
    # not yet health-checked. A second merge waits for the first. (GitHub keeps at most one run
    # PENDING per group; a third merge replaces the second's pending run, which is fine — it deploys a
    # newer commit that already contains the second.) Two REPOS deploying at once are serialised on
    # the VPS itself, by flock in deploy.sh.
    concurrency:
      group: deploy-production-dashboard
      cancel-in-progress: false
    steps:
      # Skip cleanly until a VPS exists, so CI is green on a fresh repo. The secret is read through an
      # env var: secrets are not available in `if:` expressions, and comparing one there is fragile.
      - name: Check deploy target is configured
        id: target
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "${VPS_HOST}" ]; then
            echo "::notice title=Deploy skipped::VPS_HOST secret is not set. The image was pushed; nothing was deployed."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      # Only the newest commit on master may deploy from here. A re-run of an older run keeps its
      # original GITHUB_SHA and push event, and the workflow-level concurrency group does not stop a
      # re-run of an old run either — so without this, "Re-run jobs" on an old run would silently move
      # production back to an older release. Asked of GitHub at the moment the job runs, not of the
      # event payload. An intentional rollback is not blocked by this: it goes through the deploy
      # repo's "Deploy stack" workflow_dispatch, which deploys a chosen sha tag on purpose.
      - name: Refuse to deploy a commit that is no longer the head of master
        if: steps.target.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/master | cut -f1)"
          case "${head_sha}" in
            '' | *[!0-9a-f]*) echo "::error::Could not read the head of master (got '${head_sha}'). Nothing was deployed."; exit 1 ;;
          esac
          if [ "${head_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error title=Stale deploy refused::${GITHUB_SHA} is no longer the head of master (${head_sha} is). Its own run deploys the newer commit; to roll back on purpose, use the deploy repo's Deploy stack workflow."
            exit 1
          fi

      - name: Install SSH key and pinned host key
        if: steps.target.outputs.configured == 'true'
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is PINNED from a secret. StrictHostKeyChecking=yes below makes ssh refuse
          # any server whose key is not in this file, so a hijacked IP cannot receive the deploy.
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy.sh on the VPS
        if: steps.target.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # The tag must equal what metadata-action pushed: `sha-` + the first 7 hex chars of the commit.
          short_sha="${GITHUB_SHA:0:7}"
          case "${short_sha}" in
            *[!0-9a-f]* | '') echo "::error::unexpected GITHUB_SHA '${GITHUB_SHA}'"; exit 1 ;;
          esac
          # The remote command is a fixed string plus that validated hex. Nothing from a PR title,
          # branch name or commit message is ever interpolated into it.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -p "${VPS_PORT:-22}" \
            "${VPS_USER}@${VPS_HOST}" \
            "/opt/cashier/scripts/deploy.sh dashboard sha-${short_sha}"

      - name: Remove SSH key
        if: always() && steps.target.outputs.configured == 'true'
        run: rm -f ~/.ssh/deploy_key
