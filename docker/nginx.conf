# Main nginx configuration for the dashboard image (replaces the base image's /etc/nginx/nginx.conf).
#
# The site itself — routes, caching, security headers — is in default.conf. This file only holds the
# process-level settings, and each one that differs from the stock file says why.

# Two, not `auto`. Inside a container `auto` counts the HOST's cores, so a 6-core VPS would start six
# workers for a static site that the compose file limits to 64 MB. Two keeps a spare if one stalls.
worker_processes  2;

# The base image symlinks both log files to the container's stderr/stdout, which is where
# `docker logs` and the log shipper read them.
error_log  /var/log/nginx/error.log notice;

# Under /tmp because the process runs as uid 101 and cannot write to /run.
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Same reason as `pid`: the unprivileged user can only write under /tmp.
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version in headers or on error pages.
    server_tokens off;

    # One JSON object per line, so the log pipeline can parse fields instead of regex-matching text.
    # $uri, not $request_uri: the query string is left out so nothing a URL carries lands in logs.
    # $http_x_forwarded_for is the real client — $remote_addr is always the reverse proxy (Caddy).
    log_format  json  escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log  json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Compress text. The JS bundle is the bulk of every first load and shrinks roughly 3-4x.
    # gzip_proxied any: without it nginx skips compression for any request carrying a Via header,
    # which a proxy in front may add.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    include /etc/nginx/conf.d/*.conf;
}
