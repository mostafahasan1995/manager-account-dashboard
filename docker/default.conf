# The dashboard site: a static single-page app plus a runtime-generated /config.js.
#
# Copied to /etc/nginx/conf.d/default.conf, which nginx.conf includes inside its `http` block.
# HSTS is deliberately NOT set here: TLS ends at Caddy, which owns HSTS and only sends it when the
# public scheme is https. Setting it here as well would send it over plain http on a laptop.

# Written at container start by /docker-entrypoint.d/40-runtime-config.sh. It defines
# $dashboard_api_origin — the scheme://host[:port] of API_BASE_URL — which the Content-Security-Policy
# below needs, because the browser must be allowed to call an API that lives on another origin.
# nginx cannot read environment variables itself, so the script validates the URL and writes this.
include /tmp/dashboard-runtime/api-origin.conf;

# Cache policy by path, chosen in one place so every location keeps the server-level headers.
# (An `add_header` inside a location silently DROPS every add_header inherited from the server
# block — setting Cache-Control per location would lose the security headers on exactly those paths.)
#
#   /assets/*   file names carry a content hash, so a file's bytes never change: cache for a year.
#   /config.js  generated per container start: never cache, or a changed API_BASE_URL is ignored
#               until the browser's cache expires.
#   everything  index.html and friends: revalidate every time, so a deploy is picked up on the next
#   else        load. (no-cache still uses the ETag, so an unchanged file costs a 304, not a download.)
map $uri $dashboard_cache_control {
    default       "no-cache";
    ~^/assets/    "public, max-age=31536000, immutable";
    /config.js    "no-store";
}

server {
    # 8080 because the process is not root and cannot bind below 1024.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;

    # Redirects nginx generates itself (e.g. a directory without its trailing slash) would otherwise
    # carry this container's own port 8080 in the Location header, which is wrong behind Caddy.
    absolute_redirect off;

    charset        utf-8;
    charset_types  text/css text/plain application/javascript application/json image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────────────────────────
    # `always` so they are sent on 404s and errors too, not only on 200s.
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    # An admin console has no reason to be framed; framing is how clickjacking works.
    add_header X-Frame-Options         "DENY" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Content-Security-Policy, directive by directive:
    #   script-src 'self'        only the bundle and /config.js; no inline script, no eval.
    #   style-src 'unsafe-inline' the UI libraries (sonner's toaster, Radix's scroll lock) inject
    #                            <style> elements at runtime. Blocking them was measured to raise
    #                            CSP violations on the sign-in screen itself. Inline STYLE cannot run
    #                            code; inline SCRIPT, which can, stays blocked.
    #   img-src data: blob:      deposit proof images are fetched with the bearer token and shown as
    #                            blob: URLs (fetchBlobUrl in src/lib/api/client.ts).
    #   connect-src              this origin plus the API origin derived from API_BASE_URL.
    #   frame-ancestors 'none'   the CSP twin of X-Frame-Options DENY.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' $dashboard_api_origin; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Not `always`: a 404 must not be cached as immutable for a year.
    add_header Cache-Control $dashboard_cache_control;

    # Container healthcheck. Answers without touching the disk, and is not logged — a check every few
    # seconds would otherwise be most of the access log.
    location = /healthz {
        access_log    off;
        default_type  text/plain;
        return 200 "ok\n";
    }

    # The generated runtime config. It lives under /tmp because that is the only place the
    # unprivileged user can write at start. No fallback: if it is missing this is a 404, never
    # index.html served as JavaScript.
    location = /config.js {
        root /tmp/dashboard-runtime;
    }

    # Hashed build output. A file that does not exist is a real 404. Falling back to index.html here
    # would hand the browser HTML where it expects JavaScript after a deploy removed an old chunk,
    # which surfaces as a confusing syntax error instead of an honest "not found".
    location /assets/ {
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve the file if it exists, otherwise the app shell,
    # and let the router decide what /deposits/123 means.
    location / {
        try_files $uri /index.html;
    }
}
